# cargo-deny: checks the dependency tree on every pull request (ADR 0013).
# Run it locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check: a vulnerability, an unmaintained crate or a yanked
# version. Ignore one only with its id and a reason.
ignore = []

[licenses]
# The licences our dependencies use today. A new one needs a deliberate addition here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates aren't published; their licence is STU-50's decision.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# STU-38 adds the ADR 0004 dependency rules here.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
