[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
shared = { path = "crates/shared" }
domain = { path = "crates/domain" }
application = { path = "crates/application" }
inbound-mcp = { path = "crates/inbound-mcp" }
outbound-memory = { path = "crates/outbound-memory" }
async-trait = "0.1"
axum = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
http = "1"
rmcp = { version = "3.9", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tower-http = { version = "0.6", features = ["request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
