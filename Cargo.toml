[workspace]
resolver = "3"
members = ["crates/grado-domain", "crates/grado-store", "crates/grado-server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
grado-domain = { path = "crates/grado-domain" }
grado-store = { path = "crates/grado-store" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
http = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "time", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
toml = "0.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
